name: Package dry build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build
      - run: python -m build
      - name: Inspect archive policy files
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          python -m zipfile -l $wheel.FullName | Tee-Object dist\wheel-contents.txt
          if (-not (Select-String -Path dist\wheel-contents.txt -Pattern "LICENSE")) { throw "License missing from wheel" }
          if (-not (Select-String -Path dist\wheel-contents.txt -Pattern "THIRD_PARTY_NOTICES")) { throw "Notices missing from wheel" }
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          retention-days: 14
