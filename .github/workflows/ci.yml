name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Setup official PyVista headless display
        uses: pyvista/setup-headless-display-action@v3
        with:
          qt: true
      - name: Install Gmsh GLU runtime on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libglu1-mesa
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned project
        run: python -m pip install -e ".[dev]"
      - name: Unit and public integration tests
        env:
          PYVISTA_OFF_SCREEN: "true"
        run: python -m pytest -q -m "not local_su2 and not e2e" --junitxml=test-results.xml
      - name: Compile
        run: python -m compileall -q src tests
      - name: Dependency consistency
        run: python -m pip check
      - name: Diff and generated-file guard
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Tracked files contain whitespace errors." }
          git diff --exit-code -- .
          if ($LASTEXITCODE -ne 0) { throw "Tests changed tracked files." }
          git diff --cached --exit-code -- .
          if ($LASTEXITCODE -ne 0) { throw "Tests staged tracked-file changes." }
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-${{ matrix.os }}
          path: |
            test-results.xml
            artifacts/**/*.txt
          if-no-files-found: ignore
          retention-days: 7

  browser-e2e:
    name: Windows headless browser acceptance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Setup official PyVista headless display
        uses: pyvista/setup-headless-display-action@v3
        with:
          qt: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install chromium
      - name: Public synthetic STEP browser workflow
        env:
          PYVISTA_OFF_SCREEN: "true"
          PAL_E2E_ARTIFACT_DIR: artifacts/e2e
        run: python -m pytest -q tests/e2e --junitxml=e2e-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-e2e-evidence
          path: |
            e2e-results.xml
            artifacts/e2e/
          retention-days: 7
