name: Release dry run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" build
      - name: Public-tree gates
        shell: pwsh
        run: |
          python scripts/audit_licenses.py
          python -m pytest -q -m "not local_su2 and not e2e"
          python -m build
          git diff --check
          if (git ls-files | Select-String -Pattern '(?i)(Air\.STEP|Air\.SLDPRT|web-data/|artifacts/.*\.(vtu|dat|csv))') { throw "Private/runtime file in public tree" }
      - uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: dist/
          retention-days: 7
