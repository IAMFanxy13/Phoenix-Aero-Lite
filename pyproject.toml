[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-aero-lite"
version = "0.1.0.dev0"
description = "A Windows workflow for auditable fixed-wing external aerodynamics."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Xinyu Fan" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]
keywords = ["CFD", "SU2", "Gmsh", "fixed-wing", "aerodynamics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "gmsh==4.15.2",
    "meshio==5.3.5",
    "pyvista==0.48.4",
    "pyvistaqt==0.12.0",
    "PySide6==6.11.1",
    "pandas==3.0.3",
    "matplotlib==3.11.1",
    "Jinja2==3.1.6",
    "psutil==7.2.2",
    "packaging==26.2",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "python-multipart==0.0.32",
    "trame==3.13.2",
    "trame-vtk==2.11.8",
    "trame-vuetify==3.2.5",
    "nest-asyncio2==1.7.2",
]

[project.scripts]
pal = "phoenix_aero_lite.cli:main"
phoenix-aero-lite = "phoenix_aero_lite.app.gui:main"
phoenix-aero-lite-web = "phoenix_aero_lite.web.server:main"

[project.urls]
Documentation = "https://github.com/IAMFanxy13/Phoenix-Aero-Lite#readme"
Issues = "https://github.com/IAMFanxy13/Phoenix-Aero-Lite/issues"
Source = "https://github.com/IAMFanxy13/Phoenix-Aero-Lite"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "build==1.5.0",
    "ruff==0.16.1",
    "mypy==2.3.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "playwright==1.62.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["artifacts", "build", "dist", "web-data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B009"]

[tool.mypy]
python_version = "3.12"
files = [
    "src/phoenix_aero_lite/solver/grid_study.py",
    "src/phoenix_aero_lite/solver/convergence.py",
    "src/phoenix_aero_lite/models/mesh.py",
    "src/phoenix_aero_lite/models/parameters.py",
    "src/phoenix_aero_lite/models/case_manifest.py",
]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "(^|/)(artifacts|build|dist|web-data)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: headless browser acceptance tests",
    "local_su2: requires the locally installed official SU2 executable and real CAD input",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phoenix_aero_lite = ["templates/**/*.j2", "web/static/*"]
